<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Akosombo International School</title>
    <!-- Fixed asset links using Flask url_for -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- VS Code Codicons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vscode/codicons/dist/codicon.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='school_crest.png') }}">
    <script src="{{ url_for('static', filename='admin.js') }}" defer></script>
</head>
<body class="admin-body">

    <!-- ADMIN TOP BAR -->
    <header class="admin-navbar">
        <a href="{{ url_for('home') }}" class="admin-brand">
            <img src="{{ url_for('static', filename='school_crest.png') }}" alt="AIS Crest">
            <div class="admin-brand-text">
                <h1>Akosombo International School</h1>
                <span>Staff &amp; Content Management Portal</span>
            </div>
        </a>
        <div class="admin-nav-actions">
            <a href="{{ url_for('home') }}" class="btn-secondary" target="_blank">
                <i class="codicon codicon-globe"></i> View Site
            </a>
        </div>
    </header>

    <div class="admin-layout" style="padding: 40px;">
        <main class="admin-content" style="width: 100%; max-width: 800px; margin: 0 auto;">
            
            <!-- NEWS MANAGEMENT SECTION -->
            <div class="admin-card-container" style="background: var(--bg-card); padding: 24px; border-radius: var(--radius-lg);">
                <h2>Manage News Announcements</h2>
                
                <!-- Post Form -->
                <form action="/register" method="POST" style="margin-top: 20px; display: flex; gap: 10px;">
                    <input type="text" name="news_slide" placeholder="Post News Headline..." required style="flex: 1; padding: 10px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle);">
                    <button type="submit" class="btn-primary" style="padding: 10px 20px;">Post</button>
                </form>

                <hr style="margin: 24px 0; border:0; border-top: 1px solid var(--border-subtle);">

                <!-- Current Active News List -->
                <h3>Current Announcements</h3>
                <ul style="list-style: none; padding: 0; margin-top: 12px;">
                    {% for s in slides %}
                        <li style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-subtle);">
                            <span>{{ s['name'] }}</span>
                            
                            <!-- Delete Form -->
                            <form action="/delete_news" method="POST" style="display:inline; margin:0;">
                                <input type="hidden" name="slide_id" value="{{ s['id'] }}">
                                <button type="submit" style="background-color: #dc3545; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer;">X</button>
                            </form>
                        </li>
                    {% else %}
                        <p style="color: var(--text-muted);">No news announcements found.</p>
                    {% endfor %}
                </ul>
            </div>

        </main>
    </div>

</body>
</html>
