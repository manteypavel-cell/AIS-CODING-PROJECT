<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Akosombo International School</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vscode/codicons/dist/codicon.css">
</head>
<body>

    <header>
        <nav class="header">
            <a href="{{ url_for('home') }}" class="link"><i class="codicon codicon-home"></i> HOME</a>
            <a href="{{ url_for('news_page') }}" class="link"><i class="codicon codicon-megaphone"></i> NEWS</a>
            <a href="{{ url_for('contact_page') }}" class="link active"><i class="codicon codicon-mail"></i> CONTACT US</a>
        </nav>
    </header>

    <main style="max-width: 600px; margin: 40px auto; padding: 24px;">
        <h2>Contact Admissions &amp; Administration</h2>
        <p>Have questions or inquiries? Send us a message below.</p>

        <!-- Form submitting data to Flask -->
        <form action="/submit-contact" method="POST" style="display: flex; flex-direction: column; gap: 14px; margin-top: 20px;">
            <div style="display: flex; flex-direction: column; gap: 4px;">
                <label for="sender_name">Your Name</label>
                <input type="text" id="sender_name" name="sender_name" required style="padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 4px;">
                <label for="sender_email">Email Address</label>
                <input type="email" id="sender_email" name="sender_email" required style="padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
            </div>

            <div style="display: flex; flex-direction: column; gap: 4px;">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" required style="padding: 10px; border-radius: 4px; border: 1px solid #ccc;"></textarea>
            </div>

            <button type="submit" style="padding: 12px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Send Message</button>
        </form>
    </main>

</body>
</html>
