<!-- MESSAGES MANAGEMENT SECTION -->
<div class="admin-card-container" style="background: var(--bg-card); padding: 24px; border-radius: var(--radius-lg); margin-top: 24px;">
    <h2>Recent Inquiries (Contact Us)</h2>
    <ul style="list-style: none; padding: 0; margin-top: 12px;">
        {% for m in messages %}
            <li style="padding: 15px; border: 1px solid var(--border-subtle); border-radius: 8px; margin-bottom: 15px; background: var(--bg-card-subtle);">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <strong style="font-size: 1.1rem;"><i class="codicon codicon-person"></i> {{ m['first_name'] }} {{ m['last_name'] }}</strong>
                    <span style="font-size: 0.85rem; color: var(--text-muted);"><i class="codicon codicon-clock"></i> {{ m['date_sent'] }}</span>
                </div>
                <p style="font-size: 0.9rem; margin-bottom: 8px;"><strong>Email:</strong> <a href="mailto:{{ m['email'] }}" style="color: var(--cyan-dark);">{{ m['email'] }}</a></p>
                <div style="background: var(--bg-card); padding: 12px; border-radius: 6px; border: 1px solid var(--border-subtle); font-size: 0.95rem;">
                    {{ m['reason'] }}
                </div>
                
                <form action="/delete_message" method="POST" style="margin-top: 12px; text-align: right;">
                    <input type="hidden" name="message_id" value="{{ m['id'] }}">
                    <button type="submit" style="background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Delete Message</button>
                </form>
            </li>
        {% else %}
            <p style="color: var(--text-muted);">No new messages found.</p>
        {% endfor %}
    </ul>
</div>
